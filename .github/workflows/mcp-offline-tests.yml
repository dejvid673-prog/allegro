name: Allegro MCP offline tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned official MCP SDK
        run: python -m pip install -r requirements-mcp.txt
      - name: Compile MCP source and smoke script
        run: python -m compileall -q allegro_domain allegro_mcp tests scripts/smoke_mcp.py
      - name: Test offline catalog and business preflight behavior
        run: python -m unittest discover -s tests -v
      - name: Test MCP protocol and tool exposure in memory
        run: python -m scripts.smoke_mcp
