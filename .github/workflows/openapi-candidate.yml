name: Review current Allegro OpenAPI candidate

on:
  # Weekly candidate collection. Always read-only: no auto-commit or production API calls.
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/openapi-candidate.yml"
      - "scripts/build_api_catalog.py"
      - "requirements-docs.txt"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Generate candidate from official Swagger
        run: python scripts/build_api_catalog.py
      - name: Validate generated catalog and registry
        run: python scripts/validate_repository.py
      - name: Compare documented operations
        shell: bash
        run: |
          git show HEAD:sources/generated/endpoints.json > "$RUNNER_TEMP/pinned-endpoints.json"
          python scripts/compare_api_catalogs.py \
            --before "$RUNNER_TEMP/pinned-endpoints.json" \
            --after sources/generated/endpoints.json \
            --output-json candidate-operation-diff.json \
            --output-markdown candidate-operation-diff.md
          cat candidate-operation-diff.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare upstream snapshot metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = "sources/generated/openapi-metadata.json"
          old = json.loads(subprocess.check_output(["git", "show", "HEAD:" + path], text=True))
          new = json.loads(Path(path).read_text(encoding="utf-8"))
          changed = old["sha256"] != new["sha256"]
          lines = [
              "### Allegro OpenAPI candidate — human review required",
              "",
              "| Field | Committed snapshot | Candidate |",
              "|---|---|---|",
          ]
          for field in ("fetchedAt", "sha256", "pathCount", "operationCount", "schemaCount", "deprecatedOperationCount"):
              lines.append(f"| {field} | `{old.get(field)}` | `{new.get(field)}` |")
          lines += [
              "",
              "**Contract SHA changed:** " + ("YES — HOLD until reviewed PR" if changed else "NO"),
              "",
              "A different SHA alone does not prove a breaking endpoint change.",
              "Review detailed schema/media-type/scopes changes before updating pinned data.",
              "This job never commits to GitHub and never authenticates to Allegro.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("ALLEGRO_OPENAPI_CANDIDATE_DRIFT=" + str(changed).lower())
          PY
      - name: Upload review-only candidate catalog
        uses: actions/upload-artifact@v4
        with:
          name: allegro-openapi-unreviewed
          if-no-files-found: error
          retention-days: 30
          path: |
            sources/generated/endpoints.json
            sources/generated/openapi-metadata.json
            docs/02-api/endpoint-catalog.md
            candidate-operation-diff.json
            candidate-operation-diff.md
